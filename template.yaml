AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Scheduled external API ingestion into DynamoDB

Parameters:
  Environment:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9-]{1,15}$"
  ProviderName:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9_-]{1,31}$"
  ApiBaseUrl:
    Type: String
    AllowedPattern: "^https://(?:localhost|(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?[.])+[A-Za-z]{2,63}|(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:[.](?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3})(?::(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?(?:/[A-Za-z0-9._~%!$&'()*+,;=:@/-]*)?(?:[?][A-Za-z0-9._~%!$&'()*+,;=:@/?-]*)?$"
  CredentialParameterName:
    Type: String
    Default: ""
    MaxLength: 2048
    AllowedPattern: "^$|/(?=.{1,2047}$)(?!(?:[Aa][Ww][Ss]|[Ss][Ss][Mm])(?:/|$))(?:[A-Za-z0-9_.-]+/){0,14}[A-Za-z0-9_.-]+$"
  ProviderOptionsJson:
    Type: String
  ScheduleExpression:
    Type: String
    MaxLength: 256
    AllowedPattern: '^(?:rate\((?:1 (?:minute|hour|day)|(?:[2-9]|[1-9][0-9]+) (?:minutes|hours|days))\)|cron\((?:\*|(?:[0-9]|[1-5][0-9])(?:-(?:[0-9]|[1-5][0-9]))?)(?:/[1-9][0-9]*)?(?:,(?:\*|(?:[0-9]|[1-5][0-9])(?:-(?:[0-9]|[1-5][0-9]))?)(?:/[1-9][0-9]*)?)*\s+(?:\*|(?:[0-9]|1[0-9]|2[0-3])(?:-(?:[0-9]|1[0-9]|2[0-3]))?)(?:/[1-9][0-9]*)?(?:,(?:\*|(?:[0-9]|1[0-9]|2[0-3])(?:-(?:[0-9]|1[0-9]|2[0-3]))?)(?:/[1-9][0-9]*)?)*\s+(?:(?:(?:\*|(?:[1-9]|[12][0-9]|3[01])(?:-(?:[1-9]|[12][0-9]|3[01]))?)(?:/[1-9][0-9]*)?|L|(?:[1-9]|[12][0-9]|3[01])W)(?:,(?:(?:\*|(?:[1-9]|[12][0-9]|3[01])(?:-(?:[1-9]|[12][0-9]|3[01]))?)(?:/[1-9][0-9]*)?|L|(?:[1-9]|[12][0-9]|3[01])W))*\s+(?:\*|(?:[1-9]|1[0-2]|JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)(?:-(?:[1-9]|1[0-2]|JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC))?)(?:/[1-9][0-9]*)?(?:,(?:\*|(?:[1-9]|1[0-2]|JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)(?:-(?:[1-9]|1[0-2]|JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC))?)(?:/[1-9][0-9]*)?)*\s+\?\s+(?:\*|(?:19(?:7[0-9]|[89][0-9])|2[01][0-9]{2})(?:-(?:19(?:7[0-9]|[89][0-9])|2[01][0-9]{2}))?)(?:/[1-9][0-9]*)?(?:,(?:\*|(?:19(?:7[0-9]|[89][0-9])|2[01][0-9]{2})(?:-(?:19(?:7[0-9]|[89][0-9])|2[01][0-9]{2}))?)(?:/[1-9][0-9]*)?)*|\?\s+(?:\*|(?:[1-9]|1[0-2]|JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)(?:-(?:[1-9]|1[0-2]|JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC))?)(?:/[1-9][0-9]*)?(?:,(?:\*|(?:[1-9]|1[0-2]|JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)(?:-(?:[1-9]|1[0-2]|JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC))?)(?:/[1-9][0-9]*)?)*\s+(?:(?:\*|(?:[1-7]|SUN|MON|TUE|WED|THU|FRI|SAT)(?:-(?:[1-7]|SUN|MON|TUE|WED|THU|FRI|SAT))?)(?:/[1-9][0-9]*)?|(?:[1-7]|SUN|MON|TUE|WED|THU|FRI|SAT)L|(?:[1-7]|SUN|MON|TUE|WED|THU|FRI|SAT)#[1-5])(?:,(?:(?:\*|(?:[1-7]|SUN|MON|TUE|WED|THU|FRI|SAT)(?:-(?:[1-7]|SUN|MON|TUE|WED|THU|FRI|SAT))?)(?:/[1-9][0-9]*)?|(?:[1-7]|SUN|MON|TUE|WED|THU|FRI|SAT)L|(?:[1-7]|SUN|MON|TUE|WED|THU|FRI|SAT)#[1-5]))*\s+(?:\*|(?:19(?:7[0-9]|[89][0-9])|2[01][0-9]{2})(?:-(?:19(?:7[0-9]|[89][0-9])|2[01][0-9]{2}))?)(?:/[1-9][0-9]*)?(?:,(?:\*|(?:19(?:7[0-9]|[89][0-9])|2[01][0-9]{2})(?:-(?:19(?:7[0-9]|[89][0-9])|2[01][0-9]{2}))?)(?:/[1-9][0-9]*)?)*)\))$'
  ScheduleState:
    Type: String
    AllowedValues: [ENABLED, DISABLED]
    Default: DISABLED
  MaximumRetryAttempts:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 5
  MaximumEventAgeSeconds:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 86400
  MemorySize:
    Type: Number
    Default: 128
    MinValue: 128
    MaxValue: 10240
  FunctionTimeout:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 60
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
  DataRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 3650
  TableName:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_.-]{3,255}$"
  BillingMode:
    Type: String
    AllowedValues: [PROVISIONED]
    Default: PROVISIONED
  ReadCapacityUnits:
    Type: Number
    MinValue: 1
    MaxValue: 40000
  WriteCapacityUnits:
    Type: Number
    MinValue: 1
    MaxValue: 40000
  PartitionKeyName:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_.-]{1,255}$"
  PartitionKeyType:
    Type: String
    AllowedValues: [S, N, B]
  SortKeyName:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_.-]{1,255}$"
  SortKeyType:
    Type: String
    AllowedValues: [S, N, B]
  TtlAttributeName:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_.-]{1,255}$"
  StorageSchemaJson:
    Type: String
  EnablePITR:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  EnableAlarms:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  AlarmNotificationTopicArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[A-Za-z0-9-]+:sns:[A-Za-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+$"

Mappings:
  LambdaLogLevels:
    DEBUG: { Level: DEBUG }
    INFO: { Level: INFO }
    WARNING: { Level: WARN }
    ERROR: { Level: ERROR }
    CRITICAL: { Level: FATAL }

Conditions:
  HasCredential: !Not [!Equals [!Ref CredentialParameterName, ""]]
  PITREnabled: !Equals [!Ref EnablePITR, "true"]
  AlarmsEnabled: !Equals [!Ref EnableAlarms, "true"]
  HasAlarmTopic: !Not [!Equals [!Ref AlarmNotificationTopicArn, ""]]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    MemorySize: !Ref MemorySize
    Timeout: !Ref FunctionTimeout
    Tracing: Disabled
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: !FindInMap [LambdaLogLevels, !Ref LogLevel, Level]

Resources:
  ObservationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Ref TableName
      BillingMode: !Ref BillingMode
      ProvisionedThroughput:
        ReadCapacityUnits: !Ref ReadCapacityUnits
        WriteCapacityUnits: !Ref WriteCapacityUnits
      AttributeDefinitions:
        - AttributeName: !Ref PartitionKeyName
          AttributeType: !Ref PartitionKeyType
        - AttributeName: !Ref SortKeyName
          AttributeType: !Ref SortKeyType
      KeySchema:
        - AttributeName: !Ref PartitionKeyName
          KeyType: HASH
        - AttributeName: !Ref SortKeyName
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: !Ref TtlAttributeName
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [PITREnabled, true, false]
      Tags:
        - Key: Application
          Value: !Ref AWS::StackName
        - Key: Environment
          Value: !Ref Environment

  SchedulerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  FetcherFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FunctionAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteObservations
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt ObservationsTable.Arn
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${FetcherLogGroup.Arn}:*"
              - !If
                - HasCredential
                - Sid: ReadCredential
                  Effect: Allow
                  Action: ssm:GetParameter
                  Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CredentialParameterName}"
                - !Ref AWS::NoValue

  FetcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-fetcher"
      CodeUri: src/
      Handler: scheduled_ingestor.handler.lambda_handler
      Role: !GetAtt FetcherFunctionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref ObservationsTable
          PROVIDER_NAME: !Ref ProviderName
          API_BASE_URL: !Ref ApiBaseUrl
          CREDENTIAL_PARAMETER_NAME: !Ref CredentialParameterName
          PROVIDER_OPTIONS_JSON: !Ref ProviderOptionsJson
          DATA_RETENTION_DAYS: !Ref DataRetentionDays
          STORAGE_SCHEMA_JSON: !Ref StorageSchemaJson
      Events:
        FetchSchedule:
          Type: ScheduleV2
          Properties:
            Name: !Sub "${AWS::StackName}-schedule"
            Description: Invoke external API ingestion Lambda
            ScheduleExpression: !Ref ScheduleExpression
            State: !Ref ScheduleState
            FlexibleTimeWindow:
              Mode: "OFF"
            RetryPolicy:
              MaximumRetryAttempts: !Ref MaximumRetryAttempts
              MaximumEventAgeInSeconds: !Ref MaximumEventAgeSeconds
            DeadLetterConfig:
              Arn: !GetAtt SchedulerDeadLetterQueue.Arn

  FetcherLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-fetcher"
      RetentionInDays: !Ref LogRetentionDays

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmDescription: Lambda execution errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref FetcherFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmNotificationTopicArn], []]

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmDescription: Lambda throttled invocations
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref FetcherFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmNotificationTopicArn], []]

  DeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmDescription: Failed scheduled invocation in DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SchedulerDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmNotificationTopicArn], []]

Outputs:
  FunctionName:
    Value: !Ref FetcherFunction
  TableName:
    Value: !Ref ObservationsTable
  LogGroupName:
    Value: !Ref FetcherLogGroup
  DeadLetterQueueUrl:
    Value: !Ref SchedulerDeadLetterQueue
